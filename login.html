<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Livraria da Mata</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📖 Livraria da Mata</h1>
        <nav>
            <ul>
                <li><a href="login.html">Login</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li class="dropdown-container">
                    <a href="#" id="btn-sobre">Sobre ▼</a>
                    <div class="menu-vertical" id="menu-vertical-sobre">
                        <a href="#" id="sublink-empresa">A Empresa</a>
                        <a href="#" id="sublink-clientes">Clientes</a>
                    </div>
                </li>
                <li class="dropdown-container">
                    <a href="#" id="btn-contato">Contato ▼</a>
                    <div class="menu-vertical" id="menu-vertical-contato">
                        <a href="#" id="sublink-telefone">Telefones</a>
                    </div>
                </li>
            </ul>
        </nav>
        <div class="status-usuario">
            <span id="nome-usuario-logado">Visitante</span>
        </div>
    </header>

    <main>
        <section class="form-card">
            <h2>Acessar a Conta</h2>
            <form id="formLogin">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required placeholder="Sua senha">
                </div>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
            <p style="margin-top: 20px; text-align: center; font-size: 0.9rem; color: #554236;">
                Ainda não tem conta? <a href="cadastro.html" style="color: #8c431d; font-weight: bold; text-decoration: none;">Cadastre-se aqui</a>.
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="data-atual"></span> Livraria da Mata - Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
